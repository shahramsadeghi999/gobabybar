            let fpEl = document.getElementById("fp-container");
            let qEl = document.getElementById("q-container");
            if (!userHighlights[currentIndex]) userHighlights[currentIndex] = {};
            if (fpEl) userHighlights[currentIndex].fp = fpEl.innerHTML;
            if (qEl) userHighlights[currentIndex].q = qEl.innerHTML;
            saveProgress();
        }

        function handleOptionClick(optIndex) {
            const currentElimMap = eliminatedOptions[currentIndex] || {};
            if (currentElimMap[optIndex]) {
                delete currentElimMap[optIndex];
                saveProgress();
                renderQuestion();
                return;
            }
            selectAnswer(optIndex);
        }

        function toggleEliminateChoice(event, optIndex) {
            event.stopPropagation();
            if (!eliminatedOptions[currentIndex]) {
                eliminatedOptions[currentIndex] = {};
            }
            if (eliminatedOptions[currentIndex][optIndex]) {
                delete eliminatedOptions[currentIndex][optIndex];
            } else {
                eliminatedOptions[currentIndex][optIndex] = true;
            }
            saveProgress();
            renderQuestion();
        }

        function toggleFlagCurrentQuestion() {
            if (flaggedQuestions[currentIndex]) {
                delete flaggedQuestions[currentIndex];
            } else {
                flaggedQuestions[currentIndex] = true;
            }
            updateDropdownLabels();
            populateJumpMenu();
            renderQuestion();
            saveProgress();
        }

        function selectAnswer(optIndex) {
            if (window.getSelection) {
                window.getSelection().removeAllRanges();
            }

            userAnswers[currentIndex] = optIndex;
            totalCorrect = 0;
            Object.keys(userAnswers).forEach(idx => {
                if (userAnswers[idx] === examData[idx].ans) totalCorrect++;
            });
            updateScore();
            updateDropdownLabels();
            saveProgress();
            renderQuestion();

            if (Object.keys(userAnswers).length === examData.length) {
                let percentage = Math.round((totalCorrect / examData.length) * 100);
                saveStudentHistory(totalCorrect, examData.length, percentage);
            }
        }

        function updateScore() {
            const totalExamQuestions = examData.length;
            const answeredCount = Object.keys(userAnswers).length;
            const missedCount = getMissedIndices().length;
            const unattemptedCount = totalExamQuestions - answeredCount;
            const percentage = answeredCount > 0 ? Math.round((totalCorrect / answeredCount) * 100) : 0;
            
            document.getElementById("score-badge").textContent = `Score: ${totalCorrect} / ${answeredCount} (${percentage}%)`;

            const correctPercent = (totalCorrect / totalExamQuestions) * 100;
            const missedPercent = (missedCount / totalExamQuestions) * 100;

            const barCorrect = document.getElementById("bar-correct");
            const barMissed = document.getElementById("bar-missed");
            const barUnattempted = document.getElementById("bar-unattempted");

            barCorrect.style.width = `${correctPercent}%`;
            barMissed.style.width = `${missedPercent}%`;

            barCorrect.textContent = totalCorrect >= 1 ? totalCorrect : "";
            barMissed.textContent = missedCount >= 1 ? missedCount : "";
            barUnattempted.textContent = unattemptedCount >= 1 ? unattemptedCount : "";
        }

        function navigate(dir) {
            const activeList = getActiveQuestionList();
            const currentPos = activeList.indexOf(currentIndex);
            const targetPos = currentPos + dir;

            if (targetPos >= 0 && targetPos < activeList.length) {
                currentIndex = activeList[targetPos];
                renderQuestion();
            }
        }

        function jumpToQuestion(index) {
            currentIndex = parseInt(index);
            renderQuestion();
        }

        function saveProgress() {
            localStorage.setItem(STORAGE_KEY_ANSWERS, JSON.stringify(userAnswers));
            localStorage.setItem(STORAGE_KEY_FLAGS, JSON.stringify(flaggedQuestions));
            localStorage.setItem(STORAGE_KEY_ELIM, JSON.stringify(eliminatedOptions));
            localStorage.setItem(STORAGE_KEY_INDEX, currentIndex);
            localStorage.setItem(STORAGE_KEY_SCORE, totalCorrect);
            localStorage.setItem(STORAGE_KEY_FILTER, activeFilter);
            localStorage.setItem(STORAGE_KEY_RETRY, JSON.stringify(retrySessionList));
            localStorage.setItem(STORAGE_KEY_HIGHLIGHTS, JSON.stringify(userHighlights));
        }

        function loadProgress() {
            try {
                const savedAnswers = localStorage.getItem(STORAGE_KEY_ANSWERS);
                const savedFlags = localStorage.getItem(STORAGE_KEY_FLAGS);
                const savedElim = localStorage.getItem(STORAGE_KEY_ELIM);
                const savedIndex = localStorage.getItem(STORAGE_KEY_INDEX);
                const savedScore = localStorage.getItem(STORAGE_KEY_SCORE);
                const savedFilter = localStorage.getItem(STORAGE_KEY_FILTER);
                const savedRetry = localStorage.getItem(STORAGE_KEY_RETRY);
                const savedHighlights = localStorage.getItem(STORAGE_KEY_HIGHLIGHTS);

                if (savedAnswers) userAnswers = JSON.parse(savedAnswers);
                if (savedFlags) flaggedQuestions = JSON.parse(savedFlags);
                if (savedElim) eliminatedOptions = JSON.parse(savedElim);
                if (savedIndex !== null) currentIndex = parseInt(savedIndex);
                if (savedScore !== null) totalCorrect = parseInt(savedScore);
                if (savedFilter !== null) activeFilter = savedFilter;
                if (savedRetry) retrySessionList = JSON.parse(savedRetry);
                if (savedHighlights) userHighlights = JSON.parse(savedHighlights);
            } catch (e) {
                console.error("Could not load saved progress", e);
            }
        }

        function resetProgress() {
            if (confirm("Are you sure you want to clear your saved progress, answers, flags, and highlights?")) {
                localStorage.removeItem(STORAGE_KEY_ANSWERS);
                localStorage.removeItem(STORAGE_KEY_FLAGS);
                localStorage.removeItem(STORAGE_KEY_ELIM);
                localStorage.removeItem(STORAGE_KEY_INDEX);
                localStorage.removeItem(STORAGE_KEY_SCORE);
                localStorage.removeItem(STORAGE_KEY_FILTER);
                localStorage.removeItem(STORAGE_KEY_RETRY);
                localStorage.removeItem(STORAGE_KEY_HIGHLIGHTS);
                userAnswers = {};
                flaggedQuestions = {};
                eliminatedOptions = {};
                retrySessionList = [];
                userHighlights = {};
                currentIndex = 0;
                totalCorrect = 0;
                activeFilter = "all";
                initApp();
            }
        }

        function handleAnalysisExport(val) {
            if (!val) return;
            if (val === "all") exportRulesForFilter(examData.map((_, idx) => idx), "All Rules");
            if (val === "missed") exportRulesForFilter(getMissedIndices(), "Missed Rules");
            if (val === "flagged") exportRulesForFilter(getFlaggedIndices(), "Flagged Rules");
        }

        // Bold category formatting in Word Table export
        function exportRulesForFilter(indices, titleName) {
            if (indices.length === 0) {
                openModal(`Export ${titleName}`, `No questions match the "${titleName}" criteria.`, `No rules to export for ${titleName}.`);
                return;
            }

            const uniqueMap = new Map();
            indices.forEach(idx => {
                const item = examData[idx];
                const cleanTopic = item.topic.trim();
                const cleanExp = item.exp.trim();
                if (!uniqueMap.has(cleanTopic)) {
                    uniqueMap.set(cleanTopic, new Set());
                }
                uniqueMap.get(cleanTopic).add(cleanExp);
            });

            const sortedTopics = Array.from(uniqueMap.keys()).sort((a, b) => a.localeCompare(b));

            let tableOutput = "**Legal Topic Category**\t**Black Letter Law Analysis / Core Rule**\n";
            let displayOutput = `${titleName.toUpperCase()} - CATEGORIZED & SORTED (WORD TABLE COMPATIBLE):\n`;
            displayOutput += `========================================================================\n\n`;

            sortedTopics.forEach(topic => {
                const rules = Array.from(uniqueMap.get(topic));
                rules.forEach(rule => {
                    let safeRule = rule.replace(/[\r\n]+/g, " ");
                    tableOutput += `**${topic}**\t${safeRule}\n`;
                    displayOutput += `• [**${topic}**]\n  ${safeRule}\n\n`;
                });
            });

            navigator.clipboard.writeText(tableOutput).then(() => {
                openModal(
                    `${titleName} Exported & Sorted!`,
                    `${titleName} have been CATEGORIZED (IN BOLD), SORTED & COPIED TO YOUR CLIPBOARD in Tab-Delimited Table format!\n\nTo make a table in Microsoft Word:\n1. Open Word and press Paste (Ctrl+V or Cmd+V)\n2. Highlight the pasted text\n3. Click Insert > Table > Convert Text to Table... (Separate at Tabs)`,
                    displayOutput
                );
            }).catch(err => {
                openModal(
                    `${titleName} Export`,
                    "Copy the text below manually, or click 'Copy Content to Clipboard':",
                    tableOutput
                );
            });
        }

        function showMissedSummary() {
            let summary = "MISSED QUESTIONS SUMMARY (TORTS SET 2):\n========================================\n\n";
            let missedIndices = getMissedIndices();

            if (missedIndices.length === 0) {
                summary += "No missed questions yet! Great job.";
            } else {
                missedIndices.forEach(qIdx => {
                    let q = examData[qIdx];
                    let userChoice = userAnswers[qIdx];
                    summary += `• Question ${q.id} [Topic: **${q.topic}**]\n`;
                    summary += `  Your Selected Answer: (${letterLabels[userChoice]}) ${q.opts[userChoice]}\n`;
                    summary += `  Correct Answer: (${letterLabels[q.ans]}) ${q.opts[q.ans]}\n`;
                    summary += `  Core Rule: ${q.exp}\n\n`;
                });
            }

            openModal("Missed Questions Rule Analysis", "Review the legal rules for questions you answered incorrectly, or copy and paste them back into our chat for drill sets.", summary);
        }

        function showFlaggedSummary() {
            let summary = "FLAGGED QUESTIONS SUMMARY (TORTS SET 2):\n========================================\n\n";
            let flaggedIndices = getFlaggedIndices();

            if (flaggedIndices.length === 0) {
                summary += "No flagged questions yet!";
            } else {
                flaggedIndices.forEach(qIdx => {
                    let q = examData[qIdx];
                    let userChoice = userAnswers[qIdx];
                    summary += `• Question ${q.id} [Topic: **${q.topic}**]\n`;
                    if (userChoice !== undefined) {
                        summary += `  Your Selected Answer: (${letterLabels[userChoice]}) ${q.opts[userChoice]}\n`;
                    }
                    summary += `  Correct Answer: (${letterLabels[q.ans]}) ${q.opts[q.ans]}\n`;
                    summary += `  Core Rule: ${q.exp}\n\n`;
                });
            }

            openModal("Flagged Questions Rule Analysis", "Review the legal rules for questions you flagged for extra study and review.", summary);
        }

        function exportFlaggedQuestions() {
            const flagged = getFlaggedIndices().map(idx => {
                const item = examData[idx];
                return {
                    originalSet: "Torts Set 2",
                    originalId: item.id,
                    topic: item.topic,
                    factPattern: item.fp,
                    question: item.q,
                    options: item.opts,
                    correctAnswer: item.ans,
                    explanation: item.exp
                };
            });

            const content = flagged.length > 0 ? JSON.stringify(flagged, null, 2) : "No questions are currently flagged in this set.";
            openModal("Export Flagged Questions (JSON)", "Copy this JSON block and paste it into our chat to combine flagged questions across multiple sets into custom exams.", content);
        }

        function exportMissedQuestions() {
            const missed = getMissedIndices().map(idx => {
                const item = examData[idx];
                return {
                    originalSet: "Torts Set 2",
                    originalId: item.id,
                    topic: item.topic,
                    factPattern: item.fp,
                    question: item.q,
                    options: item.opts,
                    correctAnswer: item.ans,
                    explanation: item.exp
                };
            });

            const content = missed.length > 0 ? JSON.stringify(missed, null, 2) : "No questions are currently marked as missed.";
            openModal("Export Missed Questions (JSON)", "Copy this JSON block and paste it into our chat to build an automated re-test quiz solely from your missed questions.", content);
        }

        // Export Full Session Tool
        function exportFullStudentSession() {
            const sessionData = {
                version: "1.0",
                examSet: currentSetKey,
                exportDate: new Date().toLocaleString(),
                userAnswers: userAnswers,
                flaggedQuestions: flaggedQuestions,
                eliminatedOptions: eliminatedOptions,
                userHighlights: userHighlights,
                score: totalCorrect,
                totalAttempted: Object.keys(userAnswers).length,
                totalQuestions: examData.length
            };

            const jsonString = JSON.stringify(sessionData, null, 2);
            openModal(
                "Export Test Session",
                "Copy this code block and send it to your classmate, tutor, or study partner. They can click '📥 Import' on their screen to review your exact test results, missed questions, and highlights:",
                jsonString
            );
        }

        // Import Full Session Tool
        function promptImportSession() {
            let rawInput = prompt("Paste the student's Export Session code block below:");
            if (!rawInput) return;

            try {
                const imported = JSON.parse(rawInput.trim());

                if (imported.examSet && imported.examSet !== currentSetKey) {
                    alert(`Warning: This session belongs to ${imported.examSet.toUpperCase()}, but you are currently on ${currentSetKey.toUpperCase()}. Please open the matching exam set before importing.`);
                    return;
                }

                if (!imported.userAnswers) {
                    alert("Invalid session data format.");
                    return;
                }

                if (confirm(`Load session from ${imported.exportDate || "another student"} (Score: ${imported.score || 0} / ${imported.totalAttempted || 0})?\n\nNote: This will display their answers, highlights, and missed questions on your screen.`)) {
                    userAnswers = imported.userAnswers || {};
                    flaggedQuestions = imported.flaggedQuestions || {};
                    eliminatedOptions = imported.eliminatedOptions || {};
                    userHighlights = imported.userHighlights || {};
                    
                    totalCorrect = 0;
                    Object.keys(userAnswers).forEach(idx => {
                        if (userAnswers[idx] === examData[idx].ans) totalCorrect++;
                    });

                    currentIndex = 0;
                    saveProgress();
                    populateJumpMenu();
                    renderQuestion();
                    updateScore();
                    updateDropdownLabels();
                    
                    alert("Session imported successfully! You can now browse their answers, click 'Missed (X)' to see questions they got wrong, or inspect their highlighted notes.");
                }
            } catch (err) {
                alert("Error parsing import code. Please ensure you copied the complete code block.");
            }
        }

        function saveStudentHistory(score, total, percentage) {
            let historyKey = `fylsx_history_${currentSetKey}`;
            let history = JSON.parse(localStorage.getItem(historyKey) || "[]");
            
            let sessionRecord = {
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString(),
                score: score,
                total: total,
                percentage: percentage
            };
            
            history.push(sessionRecord);
            if (history.length > 10) history.shift();
            localStorage.setItem(historyKey, JSON.stringify(history));
        }

        function showStudentHistory() {
            let historyKey = `fylsx_history_${currentSetKey}`;
            let history = JSON.parse(localStorage.getItem(historyKey) || "[]");
            
            let summary = `PAST TEST PERFORMANCE HISTORY (${currentSetKey.toUpperCase()}):\n==================================================\n\n`;
            if (history.length === 0) {
                summary += "No completed past test history recorded for this set yet.";
            } else {
                history.forEach((record, idx) => {
                    summary += `Attempt #${idx + 1} — Date: ${record.date} at ${record.time}\n`;
                    summary += `  Score: ${record.score} / ${record.total} (${record.percentage}%)\n\n`;
                });
            }
            openModal("Student Test History", "Review previous attempts and score progression:", summary);
        }

        function openModal(title, desc, content) {
            document.getElementById("modal-title").textContent = title;
            document.getElementById("modal-desc").textContent = desc;
            document.getElementById("modal-textarea").value = content;
            document.getElementById("info-modal-box").classList.add("visible");
            document.getElementById("info-modal-box").scrollIntoView({ behavior: "smooth" });
        }

        function closeModal() {
            document.getElementById("info-modal-box").classList.remove("visible");
        }

        function copyModalContent() {
            const text = document.getElementById("modal-textarea");
            text.select();
            document.execCommand("copy");
            alert("Copied to clipboard!");
        }

        window.onload = initApp;
    </script>
</body>
</html>
